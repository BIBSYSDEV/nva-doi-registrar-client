plugins {
    id 'nva.doiregistrar.service.java-conventions'
}

project.ext {
    jaxbTargetDir = file("$buildDir/generated/sources/xjc")
}

sourceSets.main.java.srcDirs += jaxbTargetDir

configurations {
    jaxb
}

dependencies {
    jaxb libs.xsd2java.xjc
    jaxb libs.xsd2java.impl
    jaxb libs.jakarta.bind.api
    jaxb libs.xsd2java.activation

    implementation libs.xsd2java.xjc
    implementation libs.xsd2java.impl
    implementation libs.jakarta.bind.api
    implementation libs.xsd2java.activation
}


task xsd2java() {
    def schemaVersion = '4.4'
    doLast {
        jaxbTargetDir.mkdirs()
        ant.taskdef(name: 'xjc', classname: 'com.sun.tools.xjc.XJC2Task', classpath: configurations.jaxb.asPath)
        ant.jaxbTargetDir = jaxbTargetDir
        ant.xjc(
                destdir: '${jaxbTargetDir}',
                package: 'org.datacite.schema.kernel_4',
                schema: "https://schema.datacite.org/meta/kernel-${schemaVersion}/metadata.xsd"
        )
    }
}

tasks.withType(JavaCompile) {
    dependsOn(xsd2java)
}

tasks.withType(Pmd) {
    exclude { '**/generated/*' }
}


build{
    dependsOn xsd2java
}

jar {
    from "$buildDir/classes/java/main"
    //SAM build does not know what to do with the generated duplicates.
    duplicatesStrategy(DuplicatesStrategy.WARN)
}
