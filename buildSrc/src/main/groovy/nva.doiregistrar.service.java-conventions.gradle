plugins {
    id 'nva.java-conventions'
}

group = 'com.github.bibsysdev'

nva {
    errorprone {
        allErrorsAsWarnings = false
    }
    generatedCode = ['org/datacite/schema/**']
    java {
        languageVersion = 25
    }
    pmd {
        excludedRules = [
            'AvoidCatchingGenericException',
            'AvoidThrowingRawExceptionTypes',
            'GuardLogStatement',
            'NonSerializableClass',
            'UnitTestContainsTooManyAsserts'
        ]
    }
    spotless {
        enabled = true
    }
}

dependencies {
    testRuntimeOnly(nvaCatalog.junit.jupiter.engine)
    testRuntimeOnly(nvaCatalog.junit.platform.launcher)
}
