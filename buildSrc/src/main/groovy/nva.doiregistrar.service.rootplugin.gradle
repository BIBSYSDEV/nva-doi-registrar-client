plugins{
    id 'nva.root-module-conventions'
}

nva {
    dependencyAnalysis {
        enforced = true
    }
    spectral {
        documents = ['docs/*.yaml']
        rulesetFile = file('.spectral.yaml')
    }
    generatedCode = ['org/datacite/schema/**']
    jacoco {
        minMethodCoverage = 1.000
        minClassCoverage = 1.000
    }
    spotless {
        enabled = true
    }
}
